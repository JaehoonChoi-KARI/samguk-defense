<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>balance</title>
</head>
<body>
<pre id="out">running...</pre>
<script type="module">
// Balance measurement: a bot plays each stage with a typical save for that point of the story.
//   ?lords=liubei,caocao,sunquan  &stages=1-20  &diff=1  &runs=1  &lvl=0 (lord levels above recommended)
//   &troop=0 (extra troop levels)  &early=0 (call waves early)  &dump=1 (list enemies when a battle stalls)
//   &hp=1 &atk=1 (multiply enemy hp / atk to try values)  &items=0 (bot uses no consumable items)
//   &bosshp=1 (multiply enemy general hp)  &scd=1 (multiply lord skill cooldowns)  &gens=0 (no generals)
//   &talents=plan|troop|none (how the lord's talent points are spent)  &fhp= &fatk= (horde soldier hp / atk)
//   &naive=1 (the bot places without a plan: no road joins, choke or hill cells, formations)
import { STORIES } from '../js/stories.js';
import { buildWaves, WAVE_TUNE } from '../js/waves.js';
import { HORDE_STATS, DIFFS, crowdMult, TROOPS } from '../js/data.js';
import { stageLayout } from '../js/maps.js';
import { battleSetup } from '../js/army.js';
import { Sim } from '../js/sim.js';
import { autoplay, expectedSave, recommendRoster, recommendGenerals } from '../js/bot.js';
import { TALENT_PLAN } from '../js/talents.js';

const P = new URLSearchParams(location.search);
// &set=cavalry.atk:25,infantry.trait:null tries other numbers for our troops (null removes a trait)
for (const kv of (P.get('set') || '').split(',').filter(Boolean)) {
  const [path, v] = kv.split(':');
  const keys = path.split('.');
  let o = TROOPS;
  for (const k of keys.slice(0, -1)) o = o[k];
  o[keys[keys.length - 1]] = v === 'null' ? undefined : +v;
}
const lords = (P.get('lords') || 'liubei,caocao,sunquan').split(',');
const [a, b] = (P.get('stages') || '1-20').split('-').map(Number);
const diff = +(P.get('diff') ?? 1);
const runs = +(P.get('runs') || 1);
const lvl = +(P.get('lvl') || 0);
const troop = +(P.get('troop') || 0);
const early = P.get('early') === '1';
const useItems = P.get('items') !== '0';
if (P.has('wsize')) WAVE_TUNE.size = +P.get('wsize'); // later stages: wave size and tightness exponents
if (P.has('wtight')) WAVE_TUNE.tight = +P.get('wtight');
// more soldiers per wave for this difficulty: &cb= (before cf) &cf= (first stage rising) &ct= (at 20)
if (P.has('cb')) DIFFS[diff].crowdBase = +P.get('cb');
if (P.has('cf')) DIFFS[diff].crowdFrom = +P.get('cf');
if (P.has('ct')) DIFFS[diff].crowd = +P.get('ct');
if (P.has('cbands')) DIFFS[diff].crowdBands = P.get('cbands').split(',').map(Number); // &cbands=1.8,1.4,1.3,1
if (P.has('cscale')) DIFFS[diff].crowdScale = P.get('cscale').split(',').map(Number); // &cscale=1.1,1.1,1.2,1 on top of the above
if (P.has('cpts')) DIFFS[diff].crowdPts = P.get('cpts').split(',').map(s => s.split(':').map(Number)); // &cpts=1:1,6:1.4,20:1.4
// one soldier of the horde: hp / atk at stage 1, growth per stage, cap
for (const [q, k] of [['fhp', 'hp'], ['fhpup', 'hpUp'], ['fhpmax', 'hpMax'], ['fatk', 'atk'], ['fatkup', 'atkUp'], ['fatkmax', 'atkMax']]) {
  if (P.has(q)) HORDE_STATS[k] = +P.get(q);
}
// troop-first talents: the troop tree up to its last row, then the suggested plan
const TROOP_PLAN = ['meleeHp', 'rangedAtk', 'meleeHp', 'rangedAtk', 'meleeHp', 'rangedAtk', 'eliteFoot', 'eliteBow', 'eliteFoot', 'eliteBow',
  'eliteFoot', 'eliteBow', 'eliteHorse', 'eliteSiege', 'eliteHorse', 'eliteSiege', 'counter', 'eliteHorse', 'eliteSiege', ...TALENT_PLAN];
const talents = { troop: TROOP_PLAN, none: 'none' }[P.get('talents')] || 'plan';
const hpK = +(P.get('hp') || 1), atkK = +(P.get('atk') || 1);
const rows = [];
for (const lord of lords) {
  for (let n = a; n <= (b || a); n++) {
    const stage = STORIES[lord].stages[n - 1];
    let won = 0, gate = 0, time = 0, lost = 0, leaked = 0, bossLoss = 0, stalls = [];
    let peak = 0;
    for (let r = 0; r < runs; r++) {
      const s = expectedSave(lord, n, diff, { levelBonus: lvl, troopBonus: troop, talents });
      const ws = buildWaves(stage, n, stageLayout(n).paths.length, crowdMult(DIFFS[diff], n));
      s.roster = recommendRoster(s, ws);
      s.picks = P.get('gens') === '0' ? [] : recommendGenerals(s, ws);
      const setup = battleSetup(s, n - 1, stage, { seed: `bal${r}` });
      setup.diff = { ...setup.diff, hp: setup.diff.hp * hpK, atk: setup.diff.atk * atkK };
      if (P.has('shp')) setup.diff.shp = +P.get('shp'); // soldiers only (not the enemy general)
      if (P.has('satk')) setup.diff.satk = +P.get('satk');
      if (P.has('bosshp')) setup.bossHp = +P.get('bosshp');
      if (P.has('scd')) setup.skills.forEach(sk => { if (sk) sk.cd *= +P.get('scd'); });
      const sim = new Sim(setup);
      const step = sim.update.bind(sim); // the most enemies on the field at once
      sim.update = dt => { step(dt); if (sim.foes.length > peak) peak = sim.foes.length; };
      autoplay(sim, { callEarly: early, useItems, strategy: P.get('naive') !== '1' });
      if (sim.state === 'won') won++;
      if (sim.lostReason === 'boss') bossLoss++;
      gate += sim.gate;
      time += sim.time;
      lost += sim.stats.lost;
      leaked += sim.stats.leaked;
      if (sim.state === 'play' && P.has('dump')) {
        stalls = sim.foes.map(f => `${f.type}${f.boss ? '(boss)' : ''} ${f.state} d=${Math.round(f.d)}/${Math.round(sim.paths[f.path].len)} xy=${Math.round(f.x)},${Math.round(f.y)} hp=${Math.round(f.hp)} blk=${f.blocker?.kind || '-'} raid=${f.raid ? f.raid.type : '-'}`);
      }
      if (sim.state === 'play') stalls.unshift('STALLED');
    }
    const wv = buildWaves(stage, n, stageLayout(n).paths.length, crowdMult(DIFFS[diff], n));
    rows.push({ lord, n, title: stage.title, win: won / runs, gate: +(gate / runs).toFixed(1), time: Math.round(time / runs), lost: +(lost / runs).toFixed(1), leaked: +(leaked / runs).toFixed(1), boss: bossLoss, peak, waves: wv.length, march: Math.round(wv.reduce((s, w) => s + w.length, 0)), ...(stalls.length ? { stalls } : {}) });
  }
}
document.getElementById('out').textContent = JSON.stringify(rows);
document.title = 'done';
</script>
</body>
</html>
